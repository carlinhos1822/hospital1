<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Hospital Pokémon - Painel de Chamadas</title>
</head>
<body class="tv-page">
  <main class="tv-container">
    <section class="left-panel">
      <div class="box local-box">
        <div class="box-title" id="local-tipo">GUICHÊ</div>
        <div class="local-number" id="local-numero">--</div>
      </div>
      <div class="box history-box">
        <div class="box-title">ÚLTIMAS CHAMADAS</div>
        <ul id="history-list"></ul>
      </div>
    </section>
    <section class="right-panel">
      <div class="box patient-box">
        <div class="box-title">PACIENTE</div>
        <div class="patient-name" id="patient-name">AGUARDANDO...</div>
      </div>
      <div class="box logo-box">
        <div class="logo-text">🏥 Hospital Pokémon</div>
      </div>
    </section>
  </main>
  <script src="tv.js" defer></script>
</body>
</html>
