<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Hospital Pokémon - Atendimento</title>
</head>
<body class="form-page atendimento-page">
<main class="container">
  <header class="page-heading">
    <div>
      <h1>🏥 Hospital Pokémon</h1>
      <p>Cadastro de paciente para atendimento</p>
    </div>
    <a class="button button-secondary" href="index.html">Sair</a>
  </header>

  <form id="formAtendimento" class="card form-card">
    <h2>Dados do paciente</h2>
    <div class="form-grid">
      <div class="form-group">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" placeholder="Nome" required>
      </div>
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" placeholder="CPF">
      </div>
      <div class="form-group">
        <label for="data">Data de nascimento</label>
        <input id="data" name="data" type="date">
      </div>
      <div class="form-group">
        <label for="nomemãe">Nome da mãe</label>
        <input id="nomemãe" name="nomemãe" placeholder="Nome da mãe">
      </div>
      <div class="form-group">
        <label for="endereço">Endereço</label>
        <input id="endereço" name="endereço" placeholder="Endereço">
      </div>
      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" placeholder="Telefone">
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="E-mail">
      </div>
      <div class="form-group">
        <label for="contato">Contato de emergência</label>
        <input id="contato" name="contato" placeholder="Contato de emergência">
      </div>
      <div class="form-group">
        <label for="tipo">Tipo de atendimento</label>
        <select id="tipo" name="tipo">
          <option value="Convenio">Convênio</option>
          <option value="Particular">Particular</option>
        </select>
      </div>
      <div class="form-group">
        <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo">
          <option>Feminino</option>
          <option>Masculino</option>
          <option>Prefiro não informar</option>
        </select>
      </div>
      <div class="form-group">
        <label for="estado">Estado civil</label>
        <select id="estado" name="estado">
          <option>Solteiro</option>
          <option>Casado</option>
          <option>Viúvo</option>
          <option>Divorciado</option>
        </select>
      </div>
      <div class="form-group">
        <label for="foto">Foto</label>
        <input type="file" id="foto" accept="image/*">
      </div>
    </div>
    <p id="mensagemAtendimento" class="status-message" role="status" hidden></p>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Cadastrar paciente</button>
    </div>
  </form>
</main>

<script>
document.getElementById("formAtendimento").addEventListener("submit", async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const submitButton = form.querySelector("button[type='submit']");
  const message = document.getElementById("mensagemAtendimento");
  const patient = {
    nome: document.getElementById("nome").value.trim(),
    cpf: document.getElementById("cpf").value.trim(),
    tipo: document.getElementById("tipo").value,
    data: document.getElementById("data").value,
    nomemãe: document.getElementById("nomemãe").value.trim(),
    sexo: document.getElementById("sexo").value,
    estado: document.getElementById("estado").value,
    endereço: document.getElementById("endereço").value.trim(),
    telefone: document.getElementById("telefone").value.trim(),
    email: document.getElementById("email").value.trim(),
    contato: document.getElementById("contato").value.trim()
  };
  submitButton.disabled = true;
  message.hidden = true;
  try {
    const response = await fetch("/atendimento", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patient)
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.erro || "Não foi possível cadastrar o paciente.");
    message.textContent = `Paciente ${data.nome} enviado para a fila de triagem.`;
    message.className = "status-message success-message";
    message.hidden = false;
    form.reset();
  } catch (error) {
    message.textContent = error.message || "Erro ao conectar com o servidor.";
    message.className = "status-message error-message";
    message.hidden = false;
  } finally {
    submitButton.disabled = false;
  }
});
</script>
</body>
</html>
